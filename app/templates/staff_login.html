{% extends "staff_base.html" %}
{% block title %}Staff sign-in · Sunrise{% endblock %}
{% block content %}
<section class="panel" style="max-width:420px;margin:40px auto">
  <h2>Front desk sign-in</h2>
  <form method="post" action="/staff/login" class="row" style="flex-direction:column;align-items:stretch">
    <label for="pin"><b>Staff PIN</b></label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
    {% if error %}<p class="flash bad" role="alert">{{ error }}</p>{% endif %}
    <button class="btn fill" type="submit">Sign in</button>
  </form>
  {% if demo_mode and default_pin %}<p class="muted small">Demo PIN: 2468 (change with the STAFF_PIN setting).</p>{% endif %}
</section>
{% endblock %}
