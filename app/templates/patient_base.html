<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block refresh %}{% endblock %}
<title>{% block title %}{{ clinic_name }}{% endblock %}</title>
<style>
:root{--bg:#F2F5F4;--card:#FFF;--ink:#14201C;--muted:#4F5E58;--line:#C9D5D0;--accent:#0F6B55;--accent-ink:#FFF;
--blue:#1F5296;--blue-bg:#E0E9F7;--amber:#7A4600;--amber-bg:#FBEBD2;--red:#A3231B;--red-bg:#F8DEDB;--green-bg:#DCEFE8}
@media (prefers-color-scheme:dark){:root{--bg:#0E1412;--card:#17201D;--ink:#E7EFEB;--muted:#A3B3AC;--line:#33433D;--accent:#4CC3A2;--accent-ink:#062219;
--blue:#9DBFF2;--blue-bg:#18263D;--amber:#F2BA67;--amber-bg:#3A2A11;--red:#F59A92;--red-bg:#3D1A17;--green-bg:#15372E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:30rem;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:19px;line-height:1.2}
.lang a,.lang button{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);text-decoration:none;background:var(--card);font:inherit;font-size:15px;min-height:40px}
.emerg{background:var(--red-bg);color:var(--red);border-radius:8px;padding:8px 12px;font-weight:700}
.status{font-size:15px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.card.primary{border:2px solid var(--accent)}
.k{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.v{font-size:40px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.v small{font-size:18px;font-weight:400;color:var(--muted)}
.card.secondary .v{font-size:26px}
.sub{color:var(--muted);font-size:15px}
.btn{display:block;width:100%;text-align:center;min-height:52px;padding:13px 14px;border-radius:12px;font:inherit;font-size:18px;font-weight:700;text-decoration:none;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fine{font-size:14px;color:var(--muted)}
label{font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=tel]{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:19px;background:var(--card);color:var(--ink);width:100%}
input[aria-invalid=true]{border:2px solid var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.check input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--accent)}
.err{color:var(--red);font-weight:700;font-size:15px}
.hint{background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:8px 12px;font-size:15px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qid{font:700 36px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.qr{background:#FFF;padding:8px;border-radius:10px;width:184px;height:184px}
.qr svg{width:168px;height:168px;display:block}
.state{border-radius:10px;padding:10px 12px;font-weight:700}
.s-waiting{background:var(--blue-bg);color:var(--blue)}
.s-awaiting{background:var(--amber-bg);color:var(--amber)}
.s-confirmed,.s-arrived,.s-in_room,.s-completed{background:var(--green-bg);color:var(--accent)}
.s-removed,.s-left{background:var(--red-bg);color:var(--red)}
form{display:flex;flex-direction:column;gap:12px;margin:0}
.row2{display:flex;gap:10px}.row2>*{flex:1}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<div class="top"><b>{{ clinic_name }}</b><span class="lang">{% block langswitch %}<a href="?lang={{ other_lang }}" hreflang="{{ other_lang }}">{{ "Español" if lang == "en" else "English" }}</a>{% endblock %}</span></div>
<div class="emerg">{{ L.emergency }}</div>
{% block content %}{% endblock %}
</main>
</body>
</html>
